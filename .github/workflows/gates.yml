# 质量门禁 CI
#
# 没有这个文件，整套规范就退回到「靠人记得跑」——
# 那正是本项目要消灭的形态（规范写了但不会自动生效）。
# policies G17 会检查本文件存在且真的调用了 check.py。

name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 规则要读 git 跟踪列表，浅克隆会让 G01/G03/G09 失真

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 规则里的运行期实证（G07 的证据链检查）在 CI 里没有 /var/lib，
      # 会 SKIP——这是设计如此，那部分由服务器上的巡检覆盖。
      - name: 规范检查
        run: python3 evolution/gates/check.py .

      - name: trace 自测
        run: python3 packages/trace/test_trace.py

      - name: botkit 自测
        run: python3 packages/botkit/test_botkit.py

      # ── 自我进化闭环：两面都要验 ──────────────────────────────
      # 顺利时能转（hello-harness 自动收敛）＋ 出事时能停（13 项失败路径）。
      # 只验前者最危险：那样的闭环会在出事那天把坏东西 promote 上去，
      # 然后报告「一轮成功」。
      - name: 闭环失败路径自测
        run: python3 packages/evolve/test_loop.py

      # Gooday 业务闭环的契约：分类/候选字段/隔离/Gate 三判据/fail-closed。
      # 用假 Gooday 跑——CI 里没有真库真文件，但【契约必须能被机械验证】。
      - name: Gooday 闭环契约（离线，不碰生产）
        run: python3 evolution/loops/gooday-assets/test_loop_assets.py

      - name: 闭环端到端（自动收敛）
        env:
          GOODAY_HARNESS_STATE: ${{ runner.temp }}/harness-state
        run: cd examples/hello-harness && python3 run.py --loop 6

      - name: 闭环留痕完整性
        env:
          GOODAY_HARNESS_STATE: ${{ runner.temp }}/harness-state
        # 跑完必须留下六样痕迹。少任何一样都说明「转是转了，但看不见」——
        # 而你没法改进一件你看不见的事。
        run: |
          for d in tasks evidence evaluations decisions experience checkpoints; do
            n=$(ls "$GOODAY_HARNESS_STATE/$d" 2>/dev/null | wc -l)
            echo "  $d: $n"
            [ "$n" -gt 0 ] || { echo "❌ $d 为空：闭环跑了却没留痕"; exit 1; }
          done

      - name: 安装脚本语法
        run: bash -n ops/install.sh

      - name: 报告留档
        if: always()
        run: python3 evolution/gates/check.py . --json > gates-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gates-report
          path: gates-report.json

# ─────────────────────────────────────────────────────────────────
# CI 盖不到的部分，必须在服务器上定期跑（G07 的运行期实证、G16 的进程比
# 代码新、cron 是否真的执行）。挂进 crontab：
#
#   0 8 * * * cd /opt/gooday-harness && python3 evolution/gates/check.py . \
#     >> /var/log/gooday-harness/gates.log 2>&1
#
# 只接 CI 不接服务器 = 恰好漏掉最容易出事的那几项。
# ─────────────────────────────────────────────────────────────────
