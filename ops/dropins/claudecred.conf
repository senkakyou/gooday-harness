# 大模型凭据：所有调模型的服务共用【同一个物理文件】。
#
# 为什么放 ops/ 而不是随服务走（G06 的例外，理由要写清楚）：
#   它对每个调模型的服务【内容完全相同】。随服务走的话就是 N 份真副本，
#   改凭据策略要改 N 处——那正是 G03 单一真源要防的。
#
# G06 说「配置随归属方走」，是为了让新增服务不必改公共目录。
# 但这份配置的归属方不是某个服务，而是【所有需要模型的服务】这个集合。
# 归属方是集合时，它就该放在集合的位置上。
#
# 绝不能把凭据【文件】复制成多份：OAuth 的 refreshToken 会轮换，
# 两份副本各自刷新会互相顶掉（旧系统真栽过两次，其中一次
# 6 个 bot 连续多天「活着但答不出话」）。所以让进程指向同一个 HOME。
[Service]
Environment=HOME=/home/agent
