# Gooday Harness 应用栈
#
# 与旧 /opt/gooday/docker-compose.yml 的关键差异：
#
# 1. 【容器名与项目名带 harness 前缀】——迁移期两套可并存，不抢名字。
# 2. 【产物走 /srv/gooday-harness/media】而不是挂源码目录里的 wwwroot/uploads。
#    G01：产物不进版本库、也不该混在代码目录里。
# 3. 数据库卷【沿用旧卷 gooday_gooday_data】——不是复制一份。
#    切换的本质是「换个进程读同一份数据」，复制会立刻产生两份真相。

name: gooday-harness

services:
  api:
    build:
      context: ../../services/api/src
    container_name: gooday-harness-api
    restart: always
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    ports:
      # 迁移期用 8081，旧 app 仍占 8080。切换时改 nginx 上游即可。
      - "127.0.0.1:8081:8080"
    volumes:
      # 数据库：沿用旧卷，不复制
      - gooday_data:/app/data
      # 产物：仓库外（G01）
      - /srv/gooday-harness/media/uploads:/app/wwwroot/uploads
      - /srv/gooday-harness/media/chat-media:/app/wwwroot/chat-media
      - /srv/gooday-harness/media/avatars:/app/wwwroot/avatars
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # 数据库在挂载卷里
      - ConnectionStrings__Default=Data Source=/app/data/gooday.db
      # ⚠️ 应用要的是 .NET 配置命名（Jwt__Secret），不是裸的 JWT_SECRET。
      #    传错名字时它【不会用默认值凑合】，而是直接拒绝启动——
      #    「生产环境不可使用默认 JWT 密钥」。这是个好设计：
      #    宁可起不来，也不要用一个人人都知道的密钥在生产跑。
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=gooday.ltd
      - Jwt__Audience=gooday.ltd
      # OCR 服务：迁移期指向 harness 的 7789（旧的 7788 已停）
      - Vision__ClaudeUrl=${CLAUDE_OCR_URL:-http://172.18.0.1:7789}
    env_file:
      - /opt/gooday-harness/.env

  # ---- Nginx 反向代理 ----
  nginx:
    image: nginx:alpine
    container_name: gooday-harness-nginx
    restart: always
    # host 网络：绕过 Docker NAT，$$remote_addr 是真实客户端 IP。
    # 也因此它能用 127.0.0.1:8081 直达 api 容器映射到宿主机的端口。
    network_mode: host
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/certs:/etc/nginx/certs:ro
      # 正式证书：沿用旧卷，【不复制】。和数据库同理——
      # 复制会产生两份，续期时只更新一份，另一份静默过期。
      - gooday_certs:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api

  # ---- Certbot（按需手动运行，不常驻）----
  certbot:
    image: certbot/certbot
    container_name: gooday-harness-certbot
    profiles: ["tools"]        # 不随 up 启动，需要时 --profile tools 显式拉起
    volumes:
      - gooday_certs:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot

volumes:
  gooday_data:
    external: true
    # 沿用旧栈创建的卷。external 表示「这个卷不归我管，我只是用它」——
    # 这样 docker compose down 不会误删它。
    name: gooday_gooday_data
  gooday_certs:
    external: true
    name: gooday_gooday_certs
