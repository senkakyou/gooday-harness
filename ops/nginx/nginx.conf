# =====================================================
# nginx/nginx.conf —— Nginx 主配置文件
# 职责：全局参数 + HTTP 上下文，站点规则在 conf.d/*.conf 里
# =====================================================

user nginx;
worker_processes auto;           # 自动匹配 CPU 核心数，充分利用多核

events {
    worker_connections 1024;     # 每个 worker 进程最大并发连接数
}

http {
    include /etc/nginx/mime.types;  # 让 nginx 根据文件扩展名设置正确的 Content-Type
    sendfile on;                     # 开启零拷贝传输，提升静态文件发送效率

    # 排除特定 IP 的访问日志记录（值为 0 表示不记录）
    map $remote_addr $loggable {
        default         1;
        45.77.180.126   0;  # 内部/运维 IP，不记录访问日志
    }

    include /etc/nginx/conf.d/*.conf;  # 加载 conf.d 目录下的站点配置（gooday.conf）
}
