# =====================================================
# nginx/conf.d/gooday.conf —— Gooday 站点配置
# 两个 server 块：
#   80  端口：处理 ACME challenge（证书续期验证）+ 其余全部 301 跳 HTTPS
#   443 端口：SSL 终止 + 反向代理到后端 app:8080
# =====================================================

# ---- HTTP server（端口80）——  仅用于证书续期验证和 HTTPS 跳转 ----
server {
    listen 80;
    server_name www.gooday.ltd gooday.ltd;

    # Let's Encrypt ACME challenge：certbot 把验证文件写到 /var/www/certbot，
    # nginx 对外提供访问，CA 服务器通过 HTTP 访问此路径验证域名所有权
    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # 其余所有 HTTP 请求永久重定向到 HTTPS（301）
    location / { return 301 https://www.gooday.ltd$request_uri; }
}

# ---- HTTPS server（端口443）—— 主站 ----
server {
    listen 443 ssl http2;
    client_max_body_size 110M;      # 允许上传最大 110MB 的文件（工具文件可能较大）
    access_log /var/log/nginx/access.log combined if=$loggable;  # 过滤特定 IP，见 nginx.conf map
    server_name www.gooday.ltd gooday.ltd;

    # SSL 证书（由 certbot 自动签发和续期）
    ssl_certificate     /etc/letsencrypt/live/www.gooday.ltd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.gooday.ltd/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;  # 只允许现代协议，禁用不安全的 TLS 1.0/1.1
    ssl_ciphers         HIGH:!aNULL:!MD5;  # 禁用弱加密套件

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;  # HSTS：一年内强制 HTTPS
    add_header X-Frame-Options SAMEORIGIN always;                     # 防止被其他站点 iframe 嵌入（Clickjacking）
    add_header X-Content-Type-Options nosniff always;                 # 禁止浏览器猜测 Content-Type

    # ---- 屏蔽敏感路径（安全加固）----
    # 禁止访问 .git、.env、.htaccess 等敏感文件/目录，一律返回 404
    location ~ /\.(git|env|htaccess|htpasswd|svn|DS_Store)(/|$) {
        return 404;
    }

    # ---- 大文件上传端点：单独放宽体积上限（全局 110M 会把这些请求 413 拦死在 nginx，
    #      后端 Kestrel 各自还有精确限制：听书600M/论坛300M，nginx 只需不比它们小）----
    location /api/audiobooks/upload {
        client_max_body_size 600M;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;         # 600MB 慢速上传需要更长超时
        proxy_request_buffering off;     # 边收边转,不在 nginx 磁盘攒 600MB 临时文件
    }
    location /api/forum/upload {
        client_max_body_size 300M;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # ---- API 接口代理 ----
    # 所有 /api/ 路径转发到后端，透传真实 IP 和协议信息（后端日志/限流需要）
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 150s;         # 较长超时，避免慢接口（如 OCR 识别/文件处理）被断开
    }

    # ---- SignalR WebSocket 代理 ----
    # WebSocket 需要特殊处理：升级协议 + 极长超时（游戏对局/聊天可能持续很久）
    location /hubs/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;          # WebSocket 必须用 HTTP/1.1
        proxy_set_header Upgrade $http_upgrade;    # 告知后端这是协议升级请求
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;         # 10分钟超时（保持长连接）
        proxy_send_timeout 600s;
    }

    # ---- 其他所有请求（前端静态文件 + 其他后端路由）----
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
